name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        # Not 8.0: MongoDB 8.0 refuses to start on Linux 6.19 to 7.0.13,
        # which GitHub's runners use (SERVER-121912). The app uses nothing
        # that differs between the two. Move to 8.0 once runners get 7.0.14+.
        image: mongo:7.0.28
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Uses an in-memory object store and mailer; only MongoDB is real.
      - run: pytest
