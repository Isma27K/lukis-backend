name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        # Not 8.0: MongoDB 8.0 refuses to start on Linux 6.19 to 7.0.13,
        # which GitHub's runners use (SERVER-121912). The app uses nothing
        # that differs between the two. Move to 8.0 once runners get 7.0.14+.
        image: mongo:7.0.28
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Uses an in-memory object store and mailer; only MongoDB is real.
      - run: pytest

  # Once the tests pass on main, builds the image and pushes it to GitHub's
  # container registry as ghcr.io/<owner>/lukis-backend, private like this
  # repo. deploy/compose.yaml pulls it from there.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; the owner (Isma27K) isn't.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lukis-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # "latest", plus "sha-<short commit>" to pin or roll back to.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Private packages get little free storage, so keep only recent ones.
      # Never fails the run: deleting needs the repo to have admin access to
      # the package (package settings -> Manage Actions access).
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: lukis-backend
          package-type: container
          min-versions-to-keep: 10
