# Leaves the bundled MongoDB out, for a database you already run. Turn it on
# by adding it to COMPOSE_FILE in .env, e.g.
#   COMPOSE_FILE=compose.yaml:compose.own-mongo.yaml
# and set MONGO_URL there. A MongoDB on this server itself is reachable as
# host.docker.internal. Needs Docker Compose 2.24.4 or newer for !reset.
services:
  mongo:
    # Only started when asked for by name, so it never is.
    profiles: [mongo]

  # Nothing to wait for any more.
  backend:
    depends_on: !reset {}

  backup:
    depends_on: !reset {}
