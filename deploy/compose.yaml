# Lukis in production: Caddy (HTTPS) -> Next.js -> FastAPI -> MongoDB.
# Only Caddy is published; the rest talk over the compose network. Images,
# thumbnails and database backups go to the S3-compatible store in .env.
# compose.own-proxy.yaml swaps Caddy for a reverse proxy you already run, and
# compose.own-mongo.yaml the bundled MongoDB for a database you already run.
#
# Runs the images CI publishes to ghcr.io (log in first; see README.md), so
# the server needs only this folder. To build from source instead:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
name: lukis

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # Pinned with FRONTEND_TAG / BACKEND_TAG in .env, e.g. sha-1a2b3c4.
  frontend:
    image: ghcr.io/isma27k/lukis-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      # For canonical links, the sitemap and link previews. Search engines
      # are kept out of copies that don't set it.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      # "public" publishes /pricing; until then only the site owner sees it.
      PRICING_PAGE: ${PRICING_PAGE:-}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ghcr.io/isma27k/lukis-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      # The bundled database, unless .env sets MONGO_URL to your own.
      MONGO_URL: ${MONGO_URL:-mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin}
      FRONTEND_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    # So S3_ENDPOINT can reach storage on this server itself, as
    # http://host.docker.internal:<port>. Docker Desktop has it built in;
    # plain Docker on Linux doesn't.
    extra_hosts: &host-gateway
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy

  # Backs the database up to object storage every day, keeping
  # BACKUP_KEEP_DAYS days of them. Same image as the backend.
  backup:
    image: ghcr.io/isma27k/lukis-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    command:
      [
        "python", "-m", "scripts.backup", "--log-config", "logging.json",
        "run", "--every-hours", "24",
      ]
    env_file: .env
    environment: *backend-env
    extra_hosts: *host-gateway
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
